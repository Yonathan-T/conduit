service:
  name: ProductService
  package: catalog.v1
methods:
  - name: SearchProducts
    http:
      method: GET
      path: /v1/products
    request:
      fields:
        - name: query
          type: string
          location: query
        - name: limit
          type: int32
          location: query
    response:
      fields:
        - name: products
          type: Product[]
